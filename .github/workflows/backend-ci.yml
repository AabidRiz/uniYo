name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uniyo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore API
        run: dotnet restore UniYo.Api/UniYo.Api.csproj

      - name: Build API
        run: dotnet build UniYo.Api/UniYo.Api.csproj --no-restore

      - name: Restore Tests
        run: dotnet restore backend-tests/UniYO.Tests/UniYO.Tests.csproj

      - name: Run Tests
        run: dotnet test backend-tests/UniYO.Tests/UniYO.Tests.csproj --no-restore
        env:
          DATABASE_URL: "Host=localhost;Database=uniyo_test;Username=postgres;Password=postgres"
          ConnectionStrings__DefaultConnection: "Host=localhost;Database=uniyo_test;Username=postgres;Password=postgres"
          JWT__Key: "ci-test-key-not-real"
